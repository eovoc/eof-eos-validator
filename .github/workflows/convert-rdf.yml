name: Convert RDF thesaurus

on:
  push:
    branches:
      - dev
    paths:
      - "scripts/rdf/DataModelEnumeratedProperties.rdf"

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run convert-rdf.sh
        run: bash scripts/convert-rdf.sh

      - name: Commit regenerated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/schemas/eof-eos-schema.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate eof-eos-schema.json from updated RDF thesaurus"
            git push
          fi
